name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#7aa2f7&color_dots=#ebedf0,#c6d0f5,#a9b8f0,#7aa2f7,#3d59a1
            dist/snake-dark.svg?palette=github-dark&color_snake=#f7768e&color_dots=#1a1b27,#2a2e47,#3d59a1,#7aa2f7,#bb9af7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
